<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Hub</title>
    <link rel="stylesheet" href="outfit.css">
</head>

<body>
    <nav>
        <img src="LOGO FINAL.avif" alt="">

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Services</a>
        </div>
    </nav>
    <section class="Hero">
        <!-- Hero Section -->

        <h2 class="heading">Find <span>Local Services</span></h2>
        <p>Find Help Near You</p>

        <div class="input">
            <span>🔍</span>
            <input type="text" placeholder="Search Services">
            <button>Search</button>

        </div>

    </section>

    <!-- Services Section -->
    <section class="Services">

        <h2>Our Services</h2>

        <div class="Cards">
            <div class="card">
                <div class="icon">💻</div>
                <h3>Computer Services</h3>
                <p>Computer Repairing</p>
                <button>View More</button>
            </div>

            <div class="card">
                <div class="icon">🏠</div>
                <h3>Home Services</h3>
                <p>Labour and Grocery Helper</p>
                <button>View More</button>
            </div>

            <div class="card">
                <div class="icon">📱</div>
                <h3>Mobile Repairing</h3>
                <p>Mobile Repairing and clean</p>
                <button>View More</button>
            </div>

        </div>
    </section>
</body>

</html>
